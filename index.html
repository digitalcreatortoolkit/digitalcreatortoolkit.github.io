<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore digital creator tools and resources.">
  <title>Digital Creator Toolkit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f8fc;
      font-family: Arial, sans-serif;
      color: #172033;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,.07);
    }
    h1 { font-size: 30px; margin-bottom: 16px; }
    p { line-height: 1.7; color: #536174; }
    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 15px 25px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a.button:hover { background: #1d4ed8; }
    small {
      display: block;
      margin-top: 25px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Digital Creator Toolkit</h1>
    <p>
      Explore helpful tools, guides, and resources
      for creating digital products and building
      your online presence.
    </p>
    <p>
      Visit our resource store to explore
      available materials.
    </p>
    <a class="button" href="https://stan.store/digitalcreatortoolkit">
      Explore Resources
    </a>
    <small>
      Independent creator resource website.
      Some external links may be affiliate links.
    </small>
  </main>
</body>
</html>
