<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0ff">
  <meta name="description" content="Digital Creator Toolkit: independent guides and digital resources for creators.">
  <title>Digital Creator Toolkit | Explore Our Store</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2148}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(125deg,#e5dfff 0%,#eef0ff 49%,#d7edff 100%)}
    main{width:min(100%,430px);padding:43px 34px 31px;border:1px solid rgba(255,255,255,.88);border-radius:29px;background:rgba(255,255,255,.89);box-shadow:0 25px 70px rgba(57,64,130,.11);text-align:center}
    .logo{width:92px;height:92px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 22px;filter:drop-shadow(0 10px 15px rgba(76,88,245,.12))}
    .brand{font-size:11px;letter-spacing:.19em;font-weight:800;color:#5058c4;margin:0 0 13px}
    h1{font-size:clamp(25px,5vw,31px);line-height:1.2;letter-spacing:-.04em;margin:0 0 14px;font-weight:800}
    .intro{font-size:15px;line-height:1.7;color:#616c86;margin:0 auto 27px;max-width:315px}
    .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:13px;background:linear-gradient(100deg,#6450fb,#3c68fa);color:white;text-decoration:none;font-size:15px;font-weight:750;box-shadow:0 12px 22px rgba(78,87,237,.2);transition:transform .2s,box-shadow .2s}
    .cta:hover{transform:translateY(-2px);box-shadow:0 16px 26px rgba(78,87,237,.27)}
    .cta:focus-visible{outline:3px solid #1d2361;outline-offset:4px}
    footer{border-top:1px solid #e9ebf5;margin-top:31px;padding-top:19px;color:#7b839a;font-size:11px;line-height:1.65}
    @media(max-width:420px){main{padding:37px 23px 26px;border-radius:25px}.logo{width:84px;height:84px}}
    @media(prefers-reduced-motion:reduce){.cta{transition:none}.cta:hover{transform:none}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="stan-logo.jpg" alt="Digital Creator Toolkit logo" width="92" height="92">
    <p class="brand">DIGITAL CREATOR TOOLKIT</p>
    <h1>Explore Our Stan Store</h1>
    <p class="intro">Explore creator tools, digital products, guides, and resources available through our Stan Store.</p>
    <a class="cta" href="https://stan.store/digitalcreatortoolkit" rel="noopener noreferrer">Continue to Stan Store <span aria-hidden="true">→</span></a>
    <footer>Independent creator resource page. Not an official Stan Store website. Affiliate links may be included.</footer>
  </main>
</body>
</html>
