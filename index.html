<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e8ff">
  <meta name="description" content="Visit our independent Stan Store resource page.">
  <title>Stan Store | Digital Creator Toolkit</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 15%, #c7c6ff 0, transparent 38%), radial-gradient(circle at 88% 85%, #c6e6ff 0, transparent 42%), linear-gradient(135deg, #f4f0ff 0%, #e8edff 55%, #eefaff 100%); color: #202244; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 440px; text-align: center; padding: 42px 32px 30px; border: 1px solid rgba(255,255,255,.82); border-radius: 28px; background: rgba(255,255,255,.72); box-shadow: 0 24px 65px rgba(73,73,154,.13); backdrop-filter: blur(16px); }
    .logo { display: block; width: 116px; height: 116px; margin: 0 auto 20px; border-radius: 50%; object-fit: contain; box-shadow: 0 12px 32px rgba(79,86,243,.19); }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 42px); letter-spacing: -.04em; }
    .subtitle { margin: 12px 0 26px; font-size: 15px; line-height: 1.6; color: #647084; }
    .spinner { width: 33px; height: 33px; margin: 0 auto 26px; border: 3px solid #e9eafd; border-top-color: #5357ff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .button { display: block; width: 100%; padding: 17px 20px; background: linear-gradient(110deg, #6554f7, #4169f5); color: #fff; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; transition: background .2s ease; }
    .button:hover, .button:focus-visible { background: #393de5; }
    footer { margin-top: 24px; font-size: 12px; line-height: 1.6; color: #7b8293; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="stan-logo.jpg" alt="Stan Store logo">
    <h1>Stan Store</h1>
    <p class="subtitle">Explore creator resources and tools in our store.</p>
    <div class="spinner" role="img" aria-label="Decorative loading animation"></div>
    <!-- Replace the placeholder below with your real, publicly accessible Stan Store URL. -->
    <a class="button" href="https://stan.store/digitalcreatortoolkit">Continue to Stan Store &rarr;</a>
    <footer>You are visiting a gateway page that connects you to Stan Store.</footer>
  </main>
</body>
</html>
